spring.application.name=usetiming

spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/{XYZ}/v2.0
spring.security.oauth2.client.registration.azure-dev.provider=azure
spring.security.oauth2.client.registration.azure-dev.client-id=XYZ
spring.security.oauth2.client.registration.azure-dev.client-secret=XYZ
spring.security.oauth2.client.registration.azure-dev.scope=openid, email, profile, User.Read, User.ReadBasic.All

#API
app.config.graphAPIUrl = https://graph.microsoft.com/v1.0
app.config.appRegistrationId = azure-dev

#Database
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/usetiming
spring.datasource.username=root
spring.datasource.password=ram@mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true